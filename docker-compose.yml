version: '3.8'

services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://user:password@cluster.mongodb.net/test

  frontend:
    build: ./client
    ports:
      - "3000:3000"
    command: npm start
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
